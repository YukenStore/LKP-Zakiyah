<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Data Siswa</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="js/config.js?v=5.0"></script>
    <script src="js/common.js?v=5.0"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then((reg) => {
                    reg.update();
                    console.log('Service Worker: Siap dan Selalu Update!');
                })
                .catch((err) => console.log('Service Worker Failed', err));
        }
    </script>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:wght@700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .font-bricolage {
            font-family: 'Bricolage Grotesque', sans-serif;
        }

        /* Animasi Buka-Tutup Data di HP */
        .details-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .details-content.open {
            max-height: 300px;
            opacity: 1;
            padding-top: 1rem;
            border-top: 1px dashed #e2e8f0;
            margin-top: 1rem;
        }

        /* Custom scrollbar tipis untuk sidebar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased overflow-hidden flex h-[100dvh] relative">

    <div id="sidebar-placeholder"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">

                    <img src="image/Logo Insan Jaya.png" class="w-full h-full object-contain">
                </div>
                <div class="flex items-center gap-1">
                    <span class="font-bricolage font-bold text-base text-slate-900">LKP</span>
                    <span class="font-bricolage font-bold text-base text-red-600">INSAN JAYA</span>
                </div>
            </div>
            <button id="mobileMenuBtn"
                class="p-2 text-slate-600 hover:text-red-600 hover:bg-slate-50 rounded-lg transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 pb-8 md:p-6 md:pb-6">
            <div class="max-w-[1400px] mx-auto w-full">
                <!-- Header Section -->
                <div class="mb-6 md:mb-8 bg-white p-6 rounded-2xl border border-red-100 shadow-sm relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-32 h-32 bg-gradient-to-bl from-red-100 to-transparent rounded-bl-full opacity-50"></div>
                    <div class="relative z-10">
                        <h1 class="font-bricolage text-2xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-red-700 to-red-500 tracking-tight">Data Siswa Aktif</h1>
                        <p class="text-sm text-slate-500 mt-2 max-w-2xl">Kelola dan pantau daftar siswa yang sedang aktif dalam program bimbingan belajar dengan mudah.</p>
                    </div>

                <!-- Main Layout Grid -->

                    <!-- Left Sidebar (Stats) -->

                            </div>
                            
                            <!-- Stat Card 2 -->

    <script>
        let allData = [];
        const API = CONFIG.API_URL + '/api';

        function formatJadwalDisplay(jadwalStr) {
            if (!jadwalStr) return '-';
            let s = jadwalStr.trim();
            if (s.startsWith('(') && s.endsWith(')')) {
                s = s.substring(1, s.length - 1);
            }
            return s;
        }

        function populateKelasGuru(prog, kelasEl, guruEl, defaultKelas = "", defaultGuru = "") {
            kelasEl.innerHTML = '<option value="" disabled selected>Pilih kelas...</option>';
            if (CONFIG.CLASSES_BY_PROGRAM[prog]) {
                CONFIG.CLASSES_BY_PROGRAM[prog].forEach(kelas => {
                    kelasEl.innerHTML += `<option value="${kelas}" ${kelas === defaultKelas ? 'selected' : ''}>${kelas}</option>`;
                });
            }

            guruEl.innerHTML = '<option value="" disabled selected>Pilih guru...</option>';
            if (CONFIG.GURU_BY_PROGRAM[prog]) {
                CONFIG.GURU_BY_PROGRAM[prog].forEach(guru => {
                    guruEl.innerHTML += `<option value="${guru}" ${guru === defaultGuru ? 'selected' : ''}>${guru}</option>`;
                });
            }
        }

        async function loadData() {
            try {
                document.getElementById('desktopTbody').innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">⏳ Mengambil data dari server...</td></tr>`;
                document.getElementById('mobileList').innerHTML = `<div class="p-6 text-center text-slate-400 bg-white rounded-2xl border border-slate-200">⏳ Mengambil data...</div>`;

                const res = await fetchWithAuth(`${API}/data`);
                const data = await res.json();

                allData = data;
                document.getElementById('totalSiswa').innerText = data.length;

                const today = new Date().toLocaleDateString('en-CA');
                document.getElementById('totalHariIni').innerText =
                    data.filter(s => s.waktu_input.includes(today)).length;

                renderProgramStats(data);
                initFilterOptions(data);
                applyFilter();
            } catch (error) {
                console.error("Gagal memuat data", error);
                renderErrorState('desktopTbody', 'Gagal memuat data siswa dari server backend.', 'loadData');
                renderErrorState('mobileList', 'Gagal memuat data siswa dari server backend.', 'loadData');
            }
        }

        function renderDesktop(data) {
            const tbody = document.getElementById('desktopTbody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">Tidak ada data ditemukan</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(s => `
                <tr class="hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0">
                    <td class="p-4 align-top font-bold text-slate-800 leading-snug max-w-[200px]">
                        ${formatNama(s.nama_siswa)}
                    </td>
                    <td class="p-4 align-top">
                        <span class="inline-block whitespace-nowrap bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md text-xs uppercase font-bold">
                            ${s.program}
                        </span>
                    </td>
                    <td class="p-4 align-top text-red-700 font-bold whitespace-nowrap">
                        ${s.kelas}
                    </td>
                    <td class="p-4 align-top text-slate-600 font-medium min-w-[120px]">
                        ${s.guru}
                    </td>
                    <td class="p-4 align-top">
                        <span class="inline-block bg-amber-50 text-amber-600 border border-amber-100 px-3 py-1.5 rounded-lg text-xs font-bold leading-relaxed max-w-[280px] break-words">
                            ${formatJadwalDisplay(s.jadwal)}
                        </span>
                    </td>
                    <td admin-only class="p-4 align-top text-center relative">
                        <button onclick="toggleMenu(${s.id}, event)" class="w-8 h-8 rounded-lg hover:bg-slate-200 flex items-center justify-center mx-auto transition-colors">
                            ⋮
                        </button>
                        <div id="menu-${s.id}" class="hidden fixed bg-white border border-slate-200 rounded-xl shadow-xl z-[9999] min-w-[150px] overflow-hidden text-left">
                            <button onclick="editSiswa(${s.id})" class="w-full text-left px-4 py-2.5 hover:bg-slate-50 text-slate-700 font-medium text-sm border-b border-slate-100">
                                ✏️ Edit
                            </button>
                            <button onclick="hapus(${s.id})" class="w-full text-left px-4 py-2.5 hover:bg-red-50 text-red-600 font-medium text-sm">
                                🗑️ Hapus
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');

            // Panggil lagi untuk nyembunyiin tombol yang baru ke-render
            cekAksesAdmin();
        }

        function toggleMenu(id, event) {
            document.querySelectorAll('[id^="menu-"]').forEach(menu => {
                if (menu.id !== `menu-${id}`) menu.classList.add('hidden');
            });

            const menu = document.getElementById(`menu-${id}`);
            const button = event.currentTarget;
            const rect = button.getBoundingClientRect();

            menu.classList.toggle('hidden');

            if (!menu.classList.contains('hidden')) {
                const menuHeight = menu.offsetHeight;
                const spaceBelow = window.innerHeight - rect.bottom;

                if (spaceBelow < (menuHeight + 20)) {
                    menu.style.top = `${rect.top - menuHeight - 5}px`;
                } else {
                    menu.style.top = `${rect.bottom + 5}px`;
                }
                menu.style.left = `${rect.left - 110}px`;
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('[onclick^="toggleMenu"]') && !e.target.closest('[id^="menu-"]')) {
                document.querySelectorAll('[id^="menu-"]').forEach(menu => menu.classList.add('hidden'));
            }
        });

        // Hapus duplikasi refreshAplikasi karena sudah ada di common.js

        function editSiswa(id) {
            const siswa = allData.find(s => s.id == id);
            if (!siswa) return;

            document.getElementById('editId').value = siswa.id;
            document.getElementById('editNama').value = siswa.nama_siswa || '';
            
            const progEl = document.getElementById('editProgram');
            progEl.value = (siswa.program || '').toLowerCase();
            
            populateKelasGuru(progEl.value, document.getElementById('editKelas'), document.getElementById('editGuru'), siswa.kelas, siswa.guru);
            
            parseJadwalToEditForm(siswa.jadwal);

            document.getElementById('modalEdit').classList.remove('hidden');
        }

        function parseJadwalToEditForm(jadwalStr) {
            document.querySelectorAll('input[name="edit_hari"]').forEach(cb => cb.checked = false);
            document.getElementById('editJam').value = '';
            document.getElementById('editJamMasuk').value = '';
            document.getElementById('editJamKeluar').value = '';
            document.getElementById('editCustomJamContainer').classList.add('hidden');
            document.getElementById('editJadwalCustomContainer').classList.add('hidden');
            document.getElementById('editHariBelajarContainer').classList.remove('hidden');
            
            document.querySelectorAll('.edit-jadwal-check').forEach(cb => {
                cb.checked = false;
                const row = cb.closest('.jadwal-row');
                if (row) {
                    row.querySelector('.jam-masuk').value = '';
                    row.querySelector('.jam-keluar').value = '';
                }
            });

            if (!jadwalStr) return;

            jadwalStr = formatJadwalDisplay(jadwalStr);

            const standardRegex = /^(.*?)\s*\(([^)]+)\)$/;
            const match = jadwalStr.match(standardRegex);
            
            let isCustomSchedule = false;
            
            if (jadwalStr.includes('),') || jadwalStr.split('(').length > 2) {
                isCustomSchedule = true;
            } else if (match) {
                const hariStr = match[1];
                const jamStr = match[2];
                const haris = hariStr.split(',').map(h => h.trim());
                
                const validDays = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
                const allValid = haris.every(h => validDays.includes(h));
                
                if (allValid) {
                    haris.forEach(h => {
                        const cb = document.querySelector(`input[name="edit_hari"][value="${h}"]`);
                        if (cb) cb.checked = true;
                    });
                    
                    const presetJam = Array.from(document.getElementById('editJam').options).map(o => o.value);
                    if (presetJam.includes(jamStr)) {
                        document.getElementById('editJam').value = jamStr;
                    } else {
                        document.getElementById('editJam').value = 'CUSTOM';
                        document.getElementById('editCustomJamContainer').classList.remove('hidden');
                        const jamParts = jamStr.split('-');
                        if (jamParts.length === 2) {
                            document.getElementById('editJamMasuk').value = jamParts[0].trim();
                            document.getElementById('editJamKeluar').value = jamParts[1].trim();
                        }
                    }
                } else {
                    isCustomSchedule = true;
                }
            } else {
                isCustomSchedule = true;
            }
            
            if (isCustomSchedule) {
                document.getElementById('editJam').value = 'CUSTOM_SCHEDULE';
                document.getElementById('editCustomJamContainer').classList.add('hidden');
                document.getElementById('editHariBelajarContainer').classList.add('hidden');
                document.getElementById('editJadwalCustomContainer').classList.remove('hidden');
                
                const parts = jadwalStr.split('),').map(p => p.trim());
                parts.forEach(part => {
                    if (!part.endsWith(')')) part += ')'; 
                    const subMatch = part.match(/^(.*?)\s*\(([^)]+)\)$/);
                    if (subMatch) {
                        const hari = subMatch[1].trim();
                        const jam = subMatch[2].trim();
                        
                        const cb = document.querySelector(`.edit-jadwal-check[value="${hari}"]`);
                        if (cb) {
                            cb.checked = true;
                            const row = cb.closest('.jadwal-row');
                            if (row) {
                                const jamParts = jam.split('-');
                                if (jamParts.length === 2) {
                                    row.querySelector('.jam-masuk').value = jamParts[0].trim();
                                    row.querySelector('.jam-keluar').value = jamParts[1].trim();
                                }
                            }
                        }
                    }
                });
            }
        }

        function tutupModalEdit() {
            document.getElementById('modalEdit').classList.add('hidden');
        }

        async function simpanEdit() {
            let jadwalFinal = "";
            let jam = document.getElementById('editJam').value;
            
            if (jam !== 'CUSTOM_SCHEDULE') {
                const hariChecked = Array.from(document.querySelectorAll('input[name="edit_hari"]:checked')).map(el => el.value);
                if (hariChecked.length === 0) {
                    alert('Pilih minimal 1 hari!');
                    return;
                }
                let hari = hariChecked.join(', ');
                
                if (jam === 'CUSTOM') {
                    const masuk = document.getElementById('editJamMasuk').value;
                    const keluar = document.getElementById('editJamKeluar').value;
                    if (!masuk || !keluar) {
                        alert('Isi jam masuk dan jam keluar!');
                        return;
                    }
                    jam = `${masuk}-${keluar}`;
                }
                
                jadwalFinal = `${hari} (${jam})`;
            } else {
                const jadwal = [];
                document.querySelectorAll('#editJadwalCustomContainer .jadwal-row').forEach(row => {
                    const check = row.querySelector('.edit-jadwal-check');
                    if (!check.checked) return;
                    const masuk = row.querySelector('.jam-masuk').value;
                    const keluar = row.querySelector('.jam-keluar').value;
                    if (!masuk || !keluar) return;
                    jadwal.push(`${check.value} (${masuk}-${keluar})`);
                });

                if (jadwal.length === 0) {
                    alert('Pilih minimal 1 jadwal!');
                    return;
                }
                jadwalFinal = jadwal.join(', ');
            }
            
            const btn = document.getElementById('btnSimpanEdit');
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            const data = {
                id: Number(document.getElementById('editId').value),
                nama_siswa: formatNama(document.getElementById('editNama').value),
                program: document.getElementById('editProgram').value,
                kelas: document.getElementById('editKelas').value,
                guru: document.getElementById('editGuru').value,
                jadwal: jadwalFinal
            };

            try {
                await fetchWithAuth(`${API}/edit`, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                tutupModalEdit();
                loadData();
            } catch (e) {
                console.log("Aksi gagal:", e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Simpan';
            }
        }

        function renderMobile(data) {
            const container = document.getElementById('mobileList');
            if (data.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 bg-white rounded-2xl border border-slate-200">Tidak ada data ditemukan</div>`;
                return;
            }
            container.innerHTML = data.map((s, i) => {
                const inisial = s.nama_siswa ? s.nama_siswa.charAt(0).toUpperCase() : '?';
                const namaFormat = formatNama(s.nama_siswa);

                return `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center cursor-pointer gap-2" onclick="toggleDetails('det-${i}', 'icon-${i}')">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 flex-shrink-0 bg-red-100 text-red-700 rounded-full flex items-center justify-center font-bold text-lg">
                                ${inisial}
                            </div>
                            <div class="overflow-hidden">
                                <span class="font-bold text-slate-800 block truncate">${namaFormat}</span>
                                <span class="text-xs text-slate-500 font-medium block truncate">${s.kelas}</span>
                            </div>
                        </div>
                        <svg id="icon-${i}" class="w-5 h-5 text-slate-400 flex-shrink-0 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </div>
                    <div id="det-${i}" class="details-content">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-slate-50 p-2 rounded-lg"><p class="text-[10px] font-bold text-slate-400 uppercase mb-0.5">Program</p><p class="text-sm font-bold text-slate-700 capitalize">${s.program}</p></div>
                            <div class="bg-slate-50 p-2 rounded-lg"><p class="text-[10px] font-bold text-slate-400 uppercase mb-0.5">Guru</p><p class="text-sm font-bold text-slate-700">${s.guru}</p></div>
                            <div class="col-span-2 bg-amber-50 border border-amber-100 p-2 rounded-lg"><p class="text-[10px] font-bold text-amber-500 uppercase mb-0.5">Jadwal</p><p class="text-sm font-bold text-amber-700 leading-relaxed">${formatJadwalDisplay(s.jadwal)}</p></div>
                            <div admin-only class="col-span-2 mt-1 flex gap-2">
                                <button onclick="editSiswa(${s.id})" class="flex-1 flex justify-center items-center gap-2 text-slate-700 font-bold text-sm bg-slate-100 hover:bg-slate-200 py-2.5 rounded-xl transition-colors">
                                    ✏️ Edit
                                </button>
                                <button onclick="hapus(${s.id})" class="flex-1 flex justify-center items-center gap-2 text-red-600 font-bold text-sm bg-red-50 hover:bg-red-100 py-2.5 rounded-xl transition-colors">
                                    🗑️ Hapus
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');

            // Panggil lagi untuk nyembunyiin tombol yang baru ke-render
            cekAksesAdmin();
        }

        function toggleDetails(id, iconId) {
            document.getElementById(id).classList.toggle('open');
            document.getElementById(iconId).classList.toggle('rotate-180');
        }

        function applyFilter() {
            const nama = document.getElementById('searchNama')?.value.toLowerCase() || '';
            const program = document.getElementById('filterProgram')?.value || '';
            const kelas = document.getElementById('filterKelas')?.value || '';
            const guru = document.getElementById('filterGuru')?.value.toLowerCase() || '';
            const jadwal = document.getElementById('filterJadwal')?.value.toLowerCase() || '';

            const filtered = allData.filter(s =>
                s.nama_siswa.toLowerCase().includes(nama) &&
                (program === '' || s.program === program) &&
                (kelas === '' || s.kelas === kelas) &&
                s.guru.toLowerCase().includes(guru) &&
                (s.jadwal || '').toLowerCase().includes(jadwal)
            );

            filtered.sort((a, b) =>
                a.nama_siswa.localeCompare(b.nama_siswa, 'id', { sensitivity: 'base' })
            );

            renderDesktop(filtered);
            renderMobile(filtered);
        }

        function initFilterOptions(data) {
            const programSet = [...new Set(data.map(d => d.program))].sort((a, b) => a.localeCompare(b, 'id', { sensitivity: 'base' }));
            const kelasSet = [...new Set(data.map(d => d.kelas))].sort((a, b) => a.localeCompare(b, 'id', { sensitivity: 'base' }));

            const progEl = document.getElementById('filterProgram');
            const kelasEl = document.getElementById('filterKelas');

            progEl.innerHTML = '<option value="">Semua Program</option>';
            kelasEl.innerHTML = '<option value="">Semua Kelas</option>';

            programSet.forEach(p => progEl.innerHTML += `<option value="${p}">${p}</option>`);
            kelasSet.forEach(k => kelasEl.innerHTML += `<option value="${k}">${k}</option>`);
        }

        function renderProgramStats(data) {
            const container = document.getElementById('programStatsContainer');
            const countMap = {};

            data.forEach(s => {
                const prog = (s.program || '').toLowerCase();
                countMap[prog] = (countMap[prog] || 0) + 1;
            });

            // Urutkan berdasarkan jumlah siswa terbanyak
            const sorted = Object.entries(countMap).sort((a, b) => b[1] - a[1]);

            container.innerHTML = sorted.map(([prog, count]) => {
                const label = prog.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                return `
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col items-center justify-between hover:border-red-300 hover:bg-red-50/30 transition-all cursor-default">
                        <p class="text-[10px] md:text-xs font-semibold text-slate-500 text-center leading-tight flex-1 flex items-center">${label}</p>
                        <p class="font-bricolage font-bold text-xl md:text-2xl text-red-600 mt-2">${count}</p>
                    </div>
                `;
            }).join('');
        }

        function formatNama(nama) {
            return nama.toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ').trim()
                .split(' ').map(kata => kata.charAt(0).toUpperCase() + kata.slice(1)).join(' ');
        }

        async function hapus(id) {
            if (!confirm("Hapus data?")) return;

            try {
                await fetchWithAuth(`${API}/delete`, {
                    method: 'POST',
                    body: JSON.stringify({ id: id })
                });
                loadData();
            } catch (e) {
                console.log("Aksi hapus gagal:", e.message);
            }
        }

        ['searchNama', 'filterProgram', 'filterKelas', 'filterGuru', 'filterJadwal'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', applyFilter);
                el.addEventListener('change', applyFilter);
            }
        });

        loadData();

        document.addEventListener("DOMContentLoaded", () => {
            const jadwalContainer = document.getElementById('editJadwalCustomContainer');
            if (jadwalContainer) {
                jadwalContainer.innerHTML = `
                    <div class="mt-4 space-y-3">
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest">Jadwal Per Hari</label>
                        ${["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"].map(hari => `
                            <div class="jadwal-row flex items-center gap-2 sm:gap-3">
                                <input type="checkbox" value="${hari}" class="edit-jadwal-check w-4 h-4 sm:w-5 sm:h-5 flex-shrink-0 rounded border-slate-300 text-red-600 focus:ring-red-400 focus:border-red-400 shadow-sm transition-all duration-300 hover:border-red-300">
                                <span class="w-14 sm:w-20 text-xs sm:text-sm font-medium text-slate-700 flex-shrink-0">${hari}</span>
                                <input type="text" placeholder="15:30" maxlength="5" inputmode="numeric" class="jam-masuk edit-jadwal-custom-jam flex-1 min-w-0 px-1 sm:px-3 py-2 border border-slate-200 rounded-lg text-center outline-none font-mono text-xs sm:text-sm">
                                <span class="text-slate-400 flex-shrink-0">-</span>
                                <input type="text" placeholder="17:00" maxlength="5" inputmode="numeric" class="jam-keluar edit-jadwal-custom-jam flex-1 min-w-0 px-1 sm:px-3 py-2 border border-slate-200 rounded-lg text-center outline-none font-mono text-xs sm:text-sm">
                            </div>
                        `).join("")}
                    </div>
                `;

                document.querySelectorAll('.edit-jadwal-custom-jam').forEach(autoFormatJam);
            }

            const progEl = document.getElementById('editProgram');
            if (progEl) {
                progEl.addEventListener('change', (e) => {
                    populateKelasGuru(e.target.value, document.getElementById('editKelas'), document.getElementById('editGuru'));
                });
            }

            const jamSelect = document.getElementById('editJam');
            const customContainer = document.getElementById('editCustomJamContainer');
            const hariBelajarContainer = document.getElementById('editHariBelajarContainer');
            
            if (jamSelect) {
                jamSelect.addEventListener('change', () => {
                    if (jamSelect.value === 'CUSTOM') {
                        customContainer.classList.remove('hidden');
                        jadwalContainer.classList.add('hidden');
                        hariBelajarContainer.classList.remove('hidden');
                    } else if (jamSelect.value === 'CUSTOM_SCHEDULE') {
                        customContainer.classList.add('hidden');
                        jadwalContainer.classList.remove('hidden');
                        hariBelajarContainer.classList.add('hidden');
                    } else {
                        customContainer.classList.add('hidden');
                        jadwalContainer.classList.add('hidden');
                        hariBelajarContainer.classList.remove('hidden');
                    }
                });
            }
            
            const editJamMasuk = document.getElementById('editJamMasuk');
            const editJamKeluar = document.getElementById('editJamKeluar');
            if (editJamMasuk) autoFormatJam(editJamMasuk);
            if (editJamKeluar) autoFormatJam(editJamKeluar);
            
            const checkboxes = document.querySelectorAll('input[name="edit_hari"]');
            checkboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    const checked = document.querySelectorAll('input[name="edit_hari"]:checked');
                    if (checked.length > 3) {
                        cb.checked = false;
                        alert('Maksimal pilih 3 hari!');
                    }
                });
            });
        });
        
        function autoFormatJam(input) {
            input.addEventListener('input', () => {
                let value = input.value.replace(/\D/g, '').slice(0, 4);
                if (value.length >= 1 && parseInt(value[0]) > 2) value = '0' + value[0];
                if (value.length >= 2 && parseInt(value.slice(0, 2)) > 23) value = '23' + value.slice(2);
                if (value.length >= 3 && parseInt(value[2]) > 5) value = value.slice(0, 2) + '0' + value.slice(2);
                if (value.length >= 3) value = value.slice(0, 2) + ':' + value.slice(2);
                input.value = value;
            });
        }

        // ================= SISTEM KEAMANAN UI (Menyembunyikan Tombol) =================
        function cekAksesAdmin() {
            const currentUserEmail = localStorage.getItem('lkp_user_email');
            const adminEmails = CONFIG.SUPER_ADMIN_EMAILS;

            if (!adminEmails.includes(currentUserEmail)) {
                // Menghapus elemen yang ada tag admin-only (baik di Desktop maupun Mobile)
                document.querySelectorAll('[admin-only]').forEach(el => el.remove());
            }
        }

        // Panggil saat DOM Load (walaupun nanti dipanggil lagi setiap render tabel)
        document.addEventListener("DOMContentLoaded", cekAksesAdmin);
    </script>
